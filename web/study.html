<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Focus Study</title>
<meta name="description" content="Participant session for the FocusGuard focus study.">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* The task view is deliberately plain: nothing on screen should compete
     with the arithmetic for attention, because attention is the measure. */
  #task { text-align: center; padding: 6vh 0 4vh; }
  #problem { font-size: clamp(2.5rem, 12vw, 4.5rem); font-weight: 700; margin: 0 0 24px; }
  #answer {
    font-size: clamp(1.5rem, 7vw, 2rem); width: 100%; max-width: 220px;
    margin: 0 auto; text-align: center;
  }
  #feedback { min-height: 2em; font-size: 1.1rem; margin-top: 14px; }
  #feedback.right { color: var(--green); }
  #feedback.wrong { color: var(--red); }

  /* SART. The digit and the mask are deliberately the SAME size: anything
     that reflows between the two would be a motion cue at stimulus onset,
     and the participant could use it instead of reading the digit. */
  #stimulus {
    font-size: clamp(3rem, 16vw, 6rem); font-weight: 700;
    line-height: 1.2; min-height: 1.2em; margin: 0 0 24px;
    font-variant-numeric: tabular-nums;
  }
  #stimulus.sart-mask { color: var(--mute); }
  #stimulus.sart-idle { font-size: clamp(1.1rem, 4.5vw, 1.5rem); font-weight: 600; }
  #sart-help { min-height: 2.5em; font-size: 1rem; margin-top: 14px; }

  /* Thought probe. Left-aligned and quiet: it is a question, not a scoreboard,
     and anything that reads as feedback would push the answer around. */
  .probe { max-width: 480px; margin: 0 auto; text-align: left; }
  .probe-q { font-size: 1.35rem; font-weight: 600; margin: 0 0 18px; text-align: center; }
  .probe-choices { display: grid; gap: 10px; }
  .probe-choice {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px 16px; font-size: 1rem; text-align: left;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: inherit; cursor: pointer;
    /* The shared `button` rule centres its label. Without this the number
       badges sit at a different x on every row, depending on how long the
       text is, and the list loses the straight left edge you read down. */
    justify-content: flex-start;
  }
  .probe-choice > span:last-child { flex: 1; }
  .probe-choice:hover, .probe-choice:focus-visible {
    border-color: var(--green); outline: none;
  }
  .probe-key {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 6px;
    display: grid; place-items: center; font-size: .85rem; font-weight: 700;
    background: var(--line); color: var(--mute);
  }
  #clock { font-variant-numeric: tabular-nums; color: var(--mute); margin-top: 18px; }
  #cam { position: fixed; right: 12px; bottom: 12px; width: 150px; border-radius: 10px;
         border: 1px solid var(--line); transform: scaleX(-1); z-index: 5; background: #000; }
  #cam.hidden { display: none; }
  .stack { display: grid; gap: 10px; }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <div class="wrap" style="padding-top:40px">
    <div class="card"><p class="muted">Loading&hellip;</p></div>
  </div>
</main>
<video id="cam" class="hidden" playsinline muted aria-label="Your webcam preview"></video>
<canvas id="work" class="hidden" aria-hidden="true" style="display:none"></canvas>
<script type="module" src="study/flow.js"></script>
</body>
</html>
