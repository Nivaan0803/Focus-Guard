<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parity Self-Test</title>
<meta name="description" content="Checks the JavaScript ports against values generated by the Python implementation.">
<link rel="stylesheet" href="assets/style.css">
<style>
  .pass { color: var(--green); font-weight: 600; }
  .fail { color: var(--red); font-weight: 600; }
  td.mono { font-size: .85rem; }
</style>
</head>
<body>
<main class="wrap" style="padding-top:28px;padding-bottom:48px">
  <h1>Parity self-test</h1>
  <p class="muted">Asserts the JavaScript ports reproduce the Python
     implementation exactly. Expected values in
     <span class="mono">data/parity.json</span> were generated by running the
     real functions in <span class="mono">distraction_model.py</span> and
     <span class="mono">vision_worker.py</span>.</p>
  <p class="banner" id="summary">Running&hellip;</p>
  <div id="out"></div>
  <p style="margin-top:24px"><a href="/">&larr; Back</a></p>
</main>

<script type="module">
import { HeuristicTree } from "./lib/tree.js";
import { irisPosition, eyeOpenness } from "./lib/features.js";
import { Calibration } from "./lib/calibrate.js";
import { ScoreTracker } from "./lib/score.js";
import { ProblemSource } from "./study/arithmetic.js";
import { seeded } from "./study/rng.js";
import { buildSequence, classify, summarize, TARGET_DIGIT } from "./study/sart.js";
import { deriveLabels, mapProbe, TASK_RELATED } from "./lib/labels.js";

const EPS = 1e-9;
const results = [];
const check = (name, ok, got, want) => results.push({ name, ok, got, want });
const near = (a, b, eps = EPS) => Math.abs(a - b) <= eps;

const ref = await (await fetch("data/parity.json", { cache: "no-cache" })).json();

/* ---- 1. heuristic tree, every branch including the boundaries ---- */
const tree = new HeuristicTree();
ref.tree_cases.forEach((c, i) => {
  const [label, conf, reason] = tree.predict(c.features);
  const [wl, wc, wr] = c.expect;
  check(
    `tree[${i}] ${wr}`,
    label === wl && near(conf, wc, 1e-12) && reason === wr,
    `${label} / ${conf} / ${reason}`,
    `${wl} / ${wc} / ${wr}`,
  );
});

/* ---- 2. landmark math ---- */
const lm = [];
for (const [i, xy] of Object.entries(ref.landmarks)) lm[Number(i)] = { x: xy[0], y: xy[1] };
const iris = irisPosition(lm);
check("irisPosition", near(iris, ref.iris_expected, 1e-12), iris, ref.iris_expected);
const open = eyeOpenness(lm);
check("eyeOpenness", near(open, ref.openness_expected, 1e-12), open, ref.openness_expected);

/* ---- 3. calibration: median neutral + spread-derived thresholds ---- */
{
  const cal = new Calibration();
  cal.request(3);
  cal.deadline = performance.now() - 1;        // close the window immediately
  const { pitch_samples: P, yaw_samples: Y, iris_samples: I } = ref.calibration;
  cal.samples = P.map((p, i) => [p, Y[i], I[i]]);
  const event = cal.advance(null, null);

  check("calibration completes", event === "done", event, "done");
  check("neutral pitch", near(cal.neutralPose[0], ref.calibration.neutral[0], 1e-12),
        cal.neutralPose?.[0], ref.calibration.neutral[0]);
  check("neutral yaw", near(cal.neutralPose[1], ref.calibration.neutral[1], 1e-12),
        cal.neutralPose?.[1], ref.calibration.neutral[1]);
  check("neutral iris", near(cal.neutralIris, ref.calibration.neutral_iris, 1e-12),
        cal.neutralIris, ref.calibration.neutral_iris);
  ["pitch", "yaw", "iris"].forEach((n, i) => {
    check(`threshold ${n}`, near(cal.thresholds[i], ref.calibration.thresholds[i], 1e-9),
          cal.thresholds[i], ref.calibration.thresholds[i]);
  });
}

/* ---- 4. too few samples must fail, not silently calibrate ---- */
{
  const cal = new Calibration();
  cal.request(3);
  cal.deadline = performance.now() - 1;
  cal.samples = Array.from({ length: 24 }, () => [1, 1, 0]);   // one under the minimum
  const event = cal.advance(null, null);
  check("under 25 samples fails", event === "failed" && !cal.calibrated, event, "failed");
}

/* ---- 5. leaky score: rise 0.45, fall 0.18 ---- */
{
  const s = new ScoreTracker();
  const states = [...Array(6).fill("distracted"), ...Array(6).fill("focused")];
  let ok = true, got = [];
  states.forEach((st, i) => {
    s.update(st, i, 0);
    got.push(s.score);
    if (!near(s.score, ref.score_sequence[i], 1e-12)) ok = false;
  });
  check("score smoothing sequence", ok,
        got.map((v) => v.toFixed(4)).join(", "),
        ref.score_sequence.map((v) => v.toFixed(4)).join(", "));
  check("alert threshold is 0.55", near(0.55, 0.55) && new ScoreTracker().distracted === false,
        "0.55", "0.55");
}

/* ---- 6. alert gating: grace, then the 4 s minimum gap ---- */
{
  const s = new ScoreTracker({ grace: 3, realertSeconds: 1 });
  s.score = 1.0;
  check("no alert before grace", s.shouldAlert(0, "x") === false, "no alert", "no alert");
  check("no alert at 2.9 s", s.shouldAlert(2.9, "x") === false, "no alert", "no alert");
  check("alert at 3.0 s", s.shouldAlert(3.0, "x") === true, "alert", "alert");
  check("no repeat inside 4 s", s.shouldAlert(5.0, "x") === false, "no alert", "no alert");
  check("repeat after 4 s", s.shouldAlert(7.1, "x") === true, "alert", "alert");
}

/* ---- 7. RNG lock: regression, NOT Python parity ----
 * There is no Python SART, and arithmetic's JS sequence never matched
 * Python's Mersenne Twister anyway (see rng.js). These pin the JS output so
 * extracting rng.js out of arithmetic.js, or touching it later, cannot
 * silently reshuffle every participant's stimuli. */
{
  for (const cond of ["alerts", "no_alerts"]) {
    const src = new ProblemSource("P01", cond);
    const got = Array.from({ length: 10 }, () => src.next().text);
    const want = ref.arithmetic[`P01-${cond}`];
    check(`arithmetic sequence P01-${cond}`,
          JSON.stringify(got) === JSON.stringify(want), got.join(", "), want.join(", "));
  }

  const rand = seeded(ref.sart.seed);
  const raw = Array.from({ length: 8 }, () => rand());
  check("rng first 8 for sart seed",
        raw.every((v, i) => near(v, ref.sart.rng_first8[i], 1e-15)),
        raw.join(", "), ref.sart.rng_first8.join(", "));
}

/* ---- 8. SART sequence structure ----
 * Blocks are permutations of 1..9, so the target rate is exactly 1/9 by
 * construction rather than by sampling. A drifting target count would make
 * commission_rate incomparable between participants. */
{
  const seq = buildSequence(seeded(ref.sart.seed), ref.sart.sequence.count);
  const targets = seq.filter((d) => d === TARGET_DIGIT).length;
  const rate = targets / seq.length;
  let adjacent = 0;
  for (let i = 1; i < seq.length; i++) {
    if (seq[i] === TARGET_DIGIT && seq[i - 1] === TARGET_DIGIT) adjacent += 1;
  }

  check("sart sequence length", seq.length === ref.sart.sequence.count,
        seq.length, ref.sart.sequence.count);
  check("sart target count exact", targets === ref.sart.sequence.target_count,
        targets, ref.sart.sequence.target_count);
  check("sart target rate in range",
        rate >= ref.sart.sequence.target_rate_min && rate <= ref.sart.sequence.target_rate_max,
        rate.toFixed(4), `${ref.sart.sequence.target_rate_min}-${ref.sart.sequence.target_rate_max}`);
  check("sart digits all 1-9", seq.every((d) => Number.isInteger(d) && d >= 1 && d <= 9),
        "out of range digit", "all 1-9");
  check("sart no two adjacent targets", adjacent === 0, adjacent, 0);
  check("sart first 20 digits",
        JSON.stringify(seq.slice(0, 20)) === JSON.stringify(ref.sart.sequence.first20),
        seq.slice(0, 20).join(","), ref.sart.sequence.first20.join(","));
}

/* ---- 9. Outcome table and aggregate formulas ----
 * The aggregates ARE Python parity: generated with numpy ddof=1. A population
 * SD (ddof=0) would give 282.105..., so this discriminates the convention. */
{
  ref.sart.outcome_table.forEach((c) => {
    const got = classify(c.is_target, c.responded);
    check(`classify target=${c.is_target} responded=${c.responded}`,
          got === c.expect, got, c.expect);
  });

  const agg = summarize(ref.sart.trials_fixture);
  const want = ref.sart.aggregates_expected;
  for (const [key, expected] of Object.entries(want)) {
    const got = agg[key];
    check(`aggregate ${key}`,
          typeof got === "number" && near(got, expected, 1e-12), got, expected);
  }
}

/* ---- 10. Probe -> label derivation ----
 * lib/labels.js is imported by api/export.js too, so these exercise the
 * production path rather than a copy of the rules. */
{
  const { rows: rowsIn, probes } = ref.labels;

  const dropped = deriveLabels(rowsIn, probes, { taskRelated: TASK_RELATED.DROP });
  check("labels: correct rows labelled",
        JSON.stringify(dropped.rows.map((r) => r.id)) ===
          JSON.stringify(ref.labels.expect_drop.labelled_ids),
        dropped.rows.map((r) => r.id).join(","),
        ref.labels.expect_drop.labelled_ids.join(","));

  for (const [key, expected] of Object.entries(ref.labels.expect_drop.counts)) {
    check(`labels count ${key}`, dropped.counts[key] === expected,
          dropped.counts[key], expected);
  }

  const asFocused = deriveLabels(rowsIn, probes, { taskRelated: TASK_RELATED.FOCUSED });
  check("labels: task_related as focused",
        asFocused.counts.focused === ref.labels.expect_task_related_focused.focused &&
        asFocused.counts.distracted === ref.labels.expect_task_related_focused.distracted,
        `${asFocused.counts.focused}/${asFocused.counts.distracted}`,
        `${ref.labels.expect_task_related_focused.focused}/${ref.labels.expect_task_related_focused.distracted}`);

  const asDistracted = deriveLabels(rowsIn, probes, { taskRelated: TASK_RELATED.DISTRACTED });
  check("labels: task_related as distracted",
        asDistracted.counts.focused === ref.labels.expect_task_related_distracted.focused &&
        asDistracted.counts.distracted === ref.labels.expect_task_related_distracted.distracted,
        `${asDistracted.counts.focused}/${asDistracted.counts.distracted}`,
        `${ref.labels.expect_task_related_distracted.focused}/${ref.labels.expect_task_related_distracted.distracted}`);

  // An unanswered probe must not lend its window to a later one, and a
  // dropped task_related window must not fall through either - both would be
  // attributing a mental state to a window it was never reported for.
  check("labels: unanswered probe yields no label",
        !dropped.rows.some((r) => r.id === "r4"), "r4 present", "r4 omitted");
  check("labels: ambiguous window does not fall through",
        !dropped.rows.some((r) => r.id === "r3"), "r3 present", "r3 omitted");
  check("labels: only focused/distracted ever emitted",
        dropped.rows.every((r) => r.label === "focused" || r.label === "distracted"),
        "other label emitted", "focused|distracted");

  check("mapProbe on_task", mapProbe("on_task") === "focused", mapProbe("on_task"), "focused");
  check("mapProbe mind_wandering", mapProbe("mind_wandering") === "distracted",
        mapProbe("mind_wandering"), "distracted");
  check("mapProbe external", mapProbe("external") === "distracted",
        mapProbe("external"), "distracted");
  check("mapProbe task_related drops by default", mapProbe("task_related") === null,
        mapProbe("task_related"), null);
}

/* ---- render ---- */
const failed = results.filter((r) => !r.ok);
const summary = document.getElementById("summary");
summary.className = `banner ${failed.length ? "bad" : "good"}`;
summary.textContent = failed.length
  ? `${failed.length} of ${results.length} checks FAILED`
  : `All ${results.length} checks passed`;

document.getElementById("out").innerHTML = `<div class="card"><table>
  <tr><th>Check</th><th>Result</th><th>Got</th><th>Expected</th></tr>
  ${results.map((r) => `<tr>
     <td>${r.name}</td>
     <td class="${r.ok ? "pass" : "fail"}">${r.ok ? "pass" : "FAIL"}</td>
     <td class="mono">${r.ok ? "" : String(r.got)}</td>
     <td class="mono">${r.ok ? "" : String(r.want)}</td>
   </tr>`).join("")}
</table></div>`;
</script>
</body>
</html>
