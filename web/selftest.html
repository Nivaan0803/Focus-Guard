<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Parity Self-Test</title>
<meta name="description" content="Checks the JavaScript ports against values generated by the Python implementation.">
<link rel="stylesheet" href="assets/style.css">
<style>
  .pass { color: var(--green); font-weight: 600; }
  .fail { color: var(--red); font-weight: 600; }
  td.mono { font-size: .85rem; }
</style>
</head>
<body>
<main class="wrap" style="padding-top:28px;padding-bottom:48px">
  <h1>Parity self-test</h1>
  <p class="muted">Asserts the JavaScript ports reproduce the Python
     implementation exactly. Expected values in
     <span class="mono">data/parity.json</span> were generated by running the
     real functions in <span class="mono">distraction_model.py</span> and
     <span class="mono">vision_worker.py</span>.</p>
  <p class="banner" id="summary">Running&hellip;</p>
  <div id="out"></div>
  <p style="margin-top:24px"><a href="/">&larr; Back</a></p>
</main>

<script type="module">
import { HeuristicTree } from "./lib/tree.js";
import { irisPosition, eyeOpenness } from "./lib/features.js";
import { Calibration } from "./lib/calibrate.js";
import { ScoreTracker } from "./lib/score.js";

const EPS = 1e-9;
const results = [];
const check = (name, ok, got, want) => results.push({ name, ok, got, want });
const near = (a, b, eps = EPS) => Math.abs(a - b) <= eps;

const ref = await (await fetch("data/parity.json", { cache: "no-cache" })).json();

/* ---- 1. heuristic tree, every branch including the boundaries ---- */
const tree = new HeuristicTree();
ref.tree_cases.forEach((c, i) => {
  const [label, conf, reason] = tree.predict(c.features);
  const [wl, wc, wr] = c.expect;
  check(
    `tree[${i}] ${wr}`,
    label === wl && near(conf, wc, 1e-12) && reason === wr,
    `${label} / ${conf} / ${reason}`,
    `${wl} / ${wc} / ${wr}`,
  );
});

/* ---- 2. landmark math ---- */
const lm = [];
for (const [i, xy] of Object.entries(ref.landmarks)) lm[Number(i)] = { x: xy[0], y: xy[1] };
const iris = irisPosition(lm);
check("irisPosition", near(iris, ref.iris_expected, 1e-12), iris, ref.iris_expected);
const open = eyeOpenness(lm);
check("eyeOpenness", near(open, ref.openness_expected, 1e-12), open, ref.openness_expected);

/* ---- 3. calibration: median neutral + spread-derived thresholds ---- */
{
  const cal = new Calibration();
  cal.request(3);
  cal.deadline = performance.now() - 1;        // close the window immediately
  const { pitch_samples: P, yaw_samples: Y, iris_samples: I } = ref.calibration;
  cal.samples = P.map((p, i) => [p, Y[i], I[i]]);
  const event = cal.advance(null, null);

  check("calibration completes", event === "done", event, "done");
  check("neutral pitch", near(cal.neutralPose[0], ref.calibration.neutral[0], 1e-12),
        cal.neutralPose?.[0], ref.calibration.neutral[0]);
  check("neutral yaw", near(cal.neutralPose[1], ref.calibration.neutral[1], 1e-12),
        cal.neutralPose?.[1], ref.calibration.neutral[1]);
  check("neutral iris", near(cal.neutralIris, ref.calibration.neutral_iris, 1e-12),
        cal.neutralIris, ref.calibration.neutral_iris);
  ["pitch", "yaw", "iris"].forEach((n, i) => {
    check(`threshold ${n}`, near(cal.thresholds[i], ref.calibration.thresholds[i], 1e-9),
          cal.thresholds[i], ref.calibration.thresholds[i]);
  });
}

/* ---- 4. too few samples must fail, not silently calibrate ---- */
{
  const cal = new Calibration();
  cal.request(3);
  cal.deadline = performance.now() - 1;
  cal.samples = Array.from({ length: 24 }, () => [1, 1, 0]);   // one under the minimum
  const event = cal.advance(null, null);
  check("under 25 samples fails", event === "failed" && !cal.calibrated, event, "failed");
}

/* ---- 5. leaky score: rise 0.45, fall 0.18 ---- */
{
  const s = new ScoreTracker();
  const states = [...Array(6).fill("distracted"), ...Array(6).fill("focused")];
  let ok = true, got = [];
  states.forEach((st, i) => {
    s.update(st, i, 0);
    got.push(s.score);
    if (!near(s.score, ref.score_sequence[i], 1e-12)) ok = false;
  });
  check("score smoothing sequence", ok,
        got.map((v) => v.toFixed(4)).join(", "),
        ref.score_sequence.map((v) => v.toFixed(4)).join(", "));
  check("alert threshold is 0.55", near(0.55, 0.55) && new ScoreTracker().distracted === false,
        "0.55", "0.55");
}

/* ---- 6. alert gating: grace, then the 4 s minimum gap ---- */
{
  const s = new ScoreTracker({ grace: 3, realertSeconds: 1 });
  s.score = 1.0;
  check("no alert before grace", s.shouldAlert(0, "x") === false, "no alert", "no alert");
  check("no alert at 2.9 s", s.shouldAlert(2.9, "x") === false, "no alert", "no alert");
  check("alert at 3.0 s", s.shouldAlert(3.0, "x") === true, "alert", "alert");
  check("no repeat inside 4 s", s.shouldAlert(5.0, "x") === false, "no alert", "no alert");
  check("repeat after 4 s", s.shouldAlert(7.1, "x") === true, "alert", "alert");
}

/* ---- render ---- */
const failed = results.filter((r) => !r.ok);
const summary = document.getElementById("summary");
summary.className = `banner ${failed.length ? "bad" : "good"}`;
summary.textContent = failed.length
  ? `${failed.length} of ${results.length} checks FAILED`
  : `All ${results.length} checks passed`;

document.getElementById("out").innerHTML = `<div class="card"><table>
  <tr><th>Check</th><th>Result</th><th>Got</th><th>Expected</th></tr>
  ${results.map((r) => `<tr>
     <td>${r.name}</td>
     <td class="${r.ok ? "pass" : "fail"}">${r.ok ? "pass" : "FAIL"}</td>
     <td class="mono">${r.ok ? "" : String(r.got)}</td>
     <td class="mono">${r.ok ? "" : String(r.want)}</td>
   </tr>`).join("")}
</table></div>`;
</script>
</body>
</html>
